# 5-source mixed training config for walker-3090.
# 训练样本会在五个 source 之间统一 shuffle；每个样本内部仍来自同一个 source。

data:
  # path/source_name 保留给旧单源逻辑；多源训练实际使用 sources。
  path: "/mnt/sda/WalkerNet/data_1x1"
  source_name: "CESM2"
  sources:
    - name: "CESM2"
      path: "/mnt/sda/WalkerNet/data_1x1"
    - name: "EC-Earth3"
      path: "/mnt/sda/WalkerNet/cmip6_1x1/EC-Earth3"
    - name: "GFDL-ESM4"
      path: "/mnt/sda/WalkerNet/cmip6_1x1/GFDL-ESM4"
    - name: "IPSL-CM6A-LR"
      path: "/mnt/sda/WalkerNet/cmip6_1x1/IPSL-CM6A-LR"
    - name: "MPI-ESM1-2-HR"
      path: "/mnt/sda/WalkerNet/cmip6_1x1/MPI-ESM1-2-HR"
  L: 12
  H: 180
  W: 360
  variables: ["tos", "zos", "tauu", "tauv"]
  norm: "zscore"
  data_cache_path: "/mnt/sda/WalkerNet/cache/mixed5_data"
  norm_stats_path: "/mnt/sda/WalkerNet/cache/mixed5_norm_stats_train.pt"
  train_years: [1850, 2000]
  val_years: [2001, 2007]
  test_years: [2008, 2014]

model:
  patch_size: 4
  d_model: 256
  nhead: 8
  dim_ff: 1024
  num_layers: 6
  patch_fusion_heads: 4
  patch_fusion_layers: 1
  patch_fusion_dim_ff: 1024
  num_experts: 12
  top_k: 2
  decoder_hidden: 128
  dropout: 0.1
  max_rollout_steps: 24
  residual_output: true

training:
  epochs: 100
  batch_size: 1
  lr: 1.0e-4
  weight_decay: 1.0e-2
  amp: true
  grad_accum_steps: 16
  grad_clip: 1.0
  rollout_steps: 12
  detach_rollout: true
  lead_weights: [1.0, 1.0, 1.0, 0.9, 0.9, 0.8, 0.8, 0.8, 0.7, 0.7, 0.6, 0.6]
  loss: "area_weighted_field_residual_gradient_nino_delta"
  loss_weights:
    area_weighted: true
    field: 1.0
    residual: 0.2
    gradient: 0.05
    nino34: 0.4
    nino34_delta: 0.2
  rollout_selection:
    enabled: true
    split: "val"
    interval_epochs: 2
    max_lead: 18
    leads: [6, 9, 12, 18]
    mode: "three_month_mean"
    max_samples_per_source: 24
    batch_size: 2
    score: "mean_acc"
  early_stopping:
    enabled: true
    monitor: "rollout_skill"
    patience: 6
    min_delta: 0.005
  seed: 42

logging:
  log_interval: 50
  save_dir: "/mnt/sda/WalkerNet/checkpoints_mixed5"
  use_tensorboard: true
