# SSP370 WalkerNet 第一阶段：五个物理模式混训，每个模式独立归一化。

data:
  path: "/mnt/sda/WalkerNet/cmip6_ssp_1x1/ssp370/CESM2"
  source_name: "CESM2"
  sources:
    - name: "CESM2"
      path: "/mnt/sda/WalkerNet/cmip6_ssp_1x1/ssp370/CESM2"
    - name: "EC-Earth3"
      path: "/mnt/sda/WalkerNet/cmip6_ssp_1x1/ssp370/EC-Earth3"
    - name: "GFDL-ESM4"
      path: "/mnt/sda/WalkerNet/cmip6_ssp_1x1/ssp370/GFDL-ESM4"
    - name: "IPSL-CM6A-LR"
      path: "/mnt/sda/WalkerNet/cmip6_ssp_1x1/ssp370/IPSL-CM6A-LR"
    - name: "MPI-ESM1-2-HR"
      path: "/mnt/sda/WalkerNet/cmip6_ssp_1x1/ssp370/MPI-ESM1-2-HR"
  L: 12
  H: 180
  W: 360
  variables: ["tos", "zos", "tauu", "tauv"]
  norm: "zscore"
  norm_scope: "source"
  data_cache_path: "/mnt/sda/WalkerNet/cache/ssp370_mixed5_data"
  norm_stats_path: "/mnt/sda/WalkerNet/cache/ssp370_sourcewise_norm_stats_train.pt"
  train_years: [2015, 2085]
  val_years: [2086, 2093]
  test_years: [2094, 2100]

model:
  patch_size: 4
  d_model: 256
  nhead: 8
  dim_ff: 1024
  num_layers: 6
  patch_fusion_heads: 4
  patch_fusion_layers: 1
  patch_fusion_dim_ff: 1024
  num_experts: 12
  top_k: 2
  decoder_hidden: 128
  dropout: 0.1
  max_rollout_steps: 24
  residual_output: true

training:
  epochs: 60
  batch_size: 1
  lr: 1.0e-4
  weight_decay: 1.0e-2
  amp: true
  grad_accum_steps: 2
  grad_clip: 1.0
  rollout_steps: 12
  detach_rollout: true
  lead_weights: [1.0, 1.0, 1.0, 0.9, 0.9, 0.8, 0.8, 0.8, 0.7, 0.7, 0.6, 0.6]
  loss: "area_weighted_field_residual_gradient_nino_delta"
  loss_weights:
    area_weighted: true
    field: 1.0
    residual: 0.2
    gradient: 0.05
    nino34: 0.4
    nino34_delta: 0.2
  rollout_selection:
    enabled: true
    split: "val"
    interval_epochs: 2
    max_lead: 18
    leads: [6, 9, 12, 18]
    mode: "three_month_mean"
    max_samples_per_source: 24
    batch_size: 2
    score: "mean_acc"
  early_stopping:
    enabled: true
    monitor: "rollout_skill"
    patience: 6
    min_delta: 0.005
    start_epoch: 40
  seed: 42

logging:
  log_interval: 50
  save_dir: "/mnt/sda/WalkerNet/checkpoints_ssp370_sourcewise_stage1"
  keep_epoch_checkpoints: [10, 20, 30, 40, 50, 60]
  use_tensorboard: true
