# WalkerNet default config
# All hyperparameters here. Both Person A (model) and Person B (data/train) read from this.

# === Data ===
data:
  path: "data_1x1"            # path to remapped data directory or file (nc / npy)
  L: 12                       # input window length: use past 12 months
  H: 180                      # grid height (latitude)
  W: 360                      # grid width (longitude)
  variables: ["tos", "zos", "tauu", "tauv"]
  norm: "zscore"              # normalization: "zscore", "minmax", or "none"
  train_years: [1850, 2000]   # inclusive; current CESM2 sample covers 1850-2014
  val_years: [2001, 2007]
  test_years: [2008, 2014]

# === Model ===
model:
  patch_size: 4               # spatial patch size
  d_model: 256                # token embedding dimension
  nhead: 8                    # number of attention heads
  dim_ff: 1024                # FFN hidden dimension
  num_layers: 6               # number of ViT blocks
  patch_fusion_heads: 4       # heads for local time-variable fusion inside each patch
  patch_fusion_layers: 1      # lightweight fusion blocks before spatial attention
  patch_fusion_dim_ff: 1024   # FFN hidden dimension in patch fusion
  num_experts: 12             # TMoE experts (default: one per month)
  top_k: 2                    # TMoE top-k soft routing
  decoder_hidden: 128         # decoder conv channel width
  dropout: 0.1
  max_rollout_steps: 24       # max supported rollout steps
  residual_output: true       # decoder predicts delta, forward returns x_last + delta

# === Training ===
training:
  epochs: 100
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-2
  amp: true
  grad_accum_steps: 1
  grad_clip: 1.0              # max gradient norm
  rollout_steps: 6            # train with autoregressive rollout for the next 6 months
  detach_rollout: true        # stop gradient through predicted frames fed back into the window
  lead_weights: [1.0, 0.8, 0.6, 0.5, 0.4, 0.3]
  loss: "field_residual_gradient_nino"
  loss_weights:
    field: 1.0
    residual: 0.5
    gradient: 0.05
    nino34: 0.2
  seed: 42

# === Logging ===
logging:
  log_interval: 50            # log every N steps
  save_dir: "checkpoints/"
  use_tensorboard: true
