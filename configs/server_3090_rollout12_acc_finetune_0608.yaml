# 8x RTX 3090 服务器上的 12-step ACC fine-tune 配置。
# 用途：从 checkpoints_rollout12_0607/best.pt 初始化，保持 RMSE 优势，同时提高 9/12/18 月 Niño3.4 ACC。

data:
  path: "/mnt/sda/WalkerNet/data_1x1"
  L: 12
  H: 180
  W: 360
  variables: ["tos", "zos", "tauu", "tauv"]
  norm: "zscore"
  data_cache_path: "/mnt/sda/WalkerNet/cache/data_1x1"
  norm_stats_path: "/mnt/sda/WalkerNet/cache/norm_stats_1x1_train.pt"
  train_years: [1850, 2000]
  val_years: [2001, 2007]
  test_years: [2008, 2014]

model:
  patch_size: 4
  d_model: 256
  nhead: 8
  dim_ff: 1024
  num_layers: 6
  patch_fusion_heads: 4
  patch_fusion_layers: 1
  patch_fusion_dim_ff: 1024
  num_experts: 12
  top_k: 2
  decoder_hidden: 128
  dropout: 0.1
  max_rollout_steps: 24
  residual_output: true

training:
  epochs: 20
  batch_size: 1
  lr: 1.0e-5
  weight_decay: 1.0e-2
  amp: true
  grad_accum_steps: 16
  grad_clip: 1.0
  rollout_steps: 12
  detach_rollout: true
  # 中远期略增权，但保留短期项，避免短 lead 退化。
  lead_weights: [0.8, 0.8, 1.0, 1.0, 1.1, 1.1, 1.3, 1.3, 1.5, 1.5, 1.3, 1.3]
  loss: "area_weighted_field_residual_gradient_nino_pattern"
  loss_weights:
    area_weighted: true
    field: 0.8
    residual: 0.15
    gradient: 0.05
    nino34: 0.4
    nino34_pattern_corr: 0.15
    nino34_pattern_variance: 0.05
    # 近似使用 1-month persistence 的 normalized RMSE 作为月变化尺度。
    residual_delta_std: [0.08, 0.04, 0.59, 0.65]
  seed: 42

logging:
  log_interval: 50
  save_dir: "/mnt/sda/WalkerNet/checkpoints_rollout12_acc_0608"
  use_tensorboard: true
