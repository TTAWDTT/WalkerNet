# Server training config for the 8x RTX 3090 machine.

data:
  path: "/mnt/sda/WalkerNet/data_1x1"
  L: 12
  H: 180
  W: 360
  variables: ["tos", "zos", "tauu", "tauv"]
  norm: "zscore"
  data_cache_path: "/mnt/sda/WalkerNet/cache/data_1x1"
  norm_stats_path: "/mnt/sda/WalkerNet/cache/norm_stats_1x1_train.pt"
  train_years: [1850, 2000]
  val_years: [2001, 2007]
  test_years: [2008, 2014]

model:
  patch_size: 4
  d_model: 256
  nhead: 8
  dim_ff: 1024
  num_layers: 6
  patch_fusion_heads: 4
  patch_fusion_layers: 1
  patch_fusion_dim_ff: 1024
  num_experts: 12
  top_k: 2
  decoder_hidden: 128
  dropout: 0.1
  max_rollout_steps: 24
  residual_output: true

training:
  epochs: 100
  batch_size: 2
  lr: 1.0e-4
  weight_decay: 1.0e-2
  amp: true
  grad_accum_steps: 8
  grad_clip: 1.0
  rollout_steps: 6
  detach_rollout: true
  lead_weights: [1.0, 0.8, 0.6, 0.5, 0.4, 0.3]
  loss: "field_residual_gradient_nino"
  loss_weights:
    field: 1.0
    residual: 0.5
    gradient: 0.05
    nino34: 0.2
  seed: 42

logging:
  log_interval: 50
  save_dir: "/mnt/sda/WalkerNet/checkpoints"
  use_tensorboard: true
