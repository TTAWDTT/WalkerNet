# 8 卡 DDP smoke test 配置。
# 目标不是正式训练，而是验证：多卡启动、读数据、forward/backward、loss 汇总、checkpoint 保存。

data:
  path: "/mnt/sda/WalkerNet/data_1x1"
  L: 12
  H: 180
  W: 360
  variables: ["tos", "zos", "tauu", "tauv"]
  norm: "zscore"
  data_cache_path: "/mnt/sda/WalkerNet/cache/data_1x1"
  norm_stats_path: "/mnt/sda/WalkerNet/cache/norm_stats_1x1_train.pt"
  train_years: [1850, 2000]
  val_years: [2001, 2007]
  test_years: [2008, 2014]

model:
  patch_size: 4
  d_model: 256
  nhead: 8
  dim_ff: 1024
  num_layers: 6
  patch_fusion_heads: 4
  patch_fusion_layers: 1
  patch_fusion_dim_ff: 1024
  num_experts: 12
  top_k: 2
  decoder_hidden: 128
  dropout: 0.1
  max_rollout_steps: 24
  residual_output: true

training:
  epochs: 1
  # DDP 下这里是“每张卡”的 batch_size。
  # 8 卡时全局 batch_size = 1 * 8 * grad_accum_steps。
  batch_size: 1
  lr: 1.0e-4
  weight_decay: 1.0e-2
  amp: true
  grad_accum_steps: 4
  grad_clip: 1.0
  max_train_steps_per_epoch: 8
  max_val_steps: 2
  rollout_steps: 2
  detach_rollout: true
  lead_weights: [1.0, 0.8]
  loss: "field_residual_gradient_nino"
  loss_weights:
    field: 1.0
    residual: 0.5
    gradient: 0.05
    nino34: 0.2
  seed: 42

logging:
  log_interval: 1
  save_dir: "/mnt/sda/WalkerNet/checkpoints_ddp_smoke"
  use_tensorboard: false
