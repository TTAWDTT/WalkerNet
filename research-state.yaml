project: WalkerNet CNOP
status: active
question: >
  Can CNOP-like optimized perturbations on the last input month of TOS/ZOS
  induce ENSO-like Niño3.4 growth in an already trained WalkerNet rollout model?
current_phase: bootstrap_and_implementation
created_at: 2026-07-03
latest_update: 2026-07-03
hypotheses:
  - id: H1
    title: Gradient-based TOS/ZOS CNOP can trigger positive Niño3.4 growth from neutral Jan-Dec cases
    status: active
    prediction: >
      Under a bounded perturbation on the previous December TOS/ZOS fields,
      optimizing through a 12-month WalkerNet rollout will raise the target-year
      Niño3.4 three-month mean above the unperturbed forecast.
experiments:
  - id: E1
    hypothesis: H1
    status: planned
    description: Select ten neutral Jan-Dec cases, solve bounded TOS/ZOS CNOP, and plot perturbation/outcome maps.
